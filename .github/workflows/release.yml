name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb-and-tarball:
    name: Build & Smoke-Test .deb + Linux Tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo DEBIAN_FRONTEND=noninteractive apt-get update \
            -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            build-essential dpkg-dev desktop-file-utils qmake6 \
            qt6-base-dev qt6-declarative-dev libqt6svg6-dev libarchive-dev

      - name: Build .deb & portable tarball
        run: |
          ./packaging/build-deb.sh
          VER="$(sed -n 's/^pkgver=//p' pkgbuild/PKGBUILD | head -n 1)"
          ARCH="$(uname -m)"
          STAGE_NAME="twinforge-${VER}-linux-${ARCH}"
          STAGE_DIR="release/${STAGE_NAME}"
          mkdir -p "$STAGE_DIR/bin" "$STAGE_DIR/share/applications" \
            "$STAGE_DIR/share/icons/hicolor/256x256/apps" "$STAGE_DIR/share/icons/hicolor/scalable/apps"
          install -Dm755 build/twinforge "$STAGE_DIR/bin/twinforge"
          ln -sfn twinforge "$STAGE_DIR/bin/tf"
          install -Dm644 pkgbuild/twinforge.desktop "$STAGE_DIR/share/applications/twinforge.desktop"
          install -Dm644 pkgbuild/twinforge.png "$STAGE_DIR/share/icons/hicolor/256x256/apps/twinforge.png"
          install -Dm644 pkgbuild/twinforge.svg "$STAGE_DIR/share/icons/hicolor/scalable/apps/twinforge.svg"
          install -Dm644 LICENSE "$STAGE_DIR/LICENSE"
          install -Dm755 install.sh "$STAGE_DIR/install.sh"
          install -Dm755 uninstall.sh "$STAGE_DIR/uninstall.sh"
          tar -czf "release/${STAGE_NAME}.tar.gz" -C release "$STAGE_NAME"
          rm -rf "$STAGE_DIR"
          install -Dm755 install.sh release/install.sh
          install -Dm755 uninstall.sh release/uninstall.sh
          install -Dm644 LICENSE release/LICENSE

      - name: Smoke-test .deb in clean Ubuntu 24.04 container
        run: |
          docker run --rm \
            -v "$PWD/release:/work/pkg:ro" \
            -v "$PWD/packaging/smoke-test-package.sh:/work/smoke-test-package.sh:ro" \
            ubuntu:24.04 \
            bash -eux -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -o Acquire::ForceIPv4=true -o Acquire::Retries=3
              apt-get install -y --no-install-recommends -o Acquire::ForceIPv4=true \
                /work/pkg/twinforge_*.deb python3 desktop-file-utils
              /work/smoke-test-package.sh /usr/bin/twinforge
            '

      - name: Upload Ubuntu & portable release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-deb-tarball
          path: |
            release/*.deb
            release/*.tar.gz
            release/install.sh
            release/uninstall.sh
            release/LICENSE
          if-no-files-found: error

  build-rpm:
    name: Build & Smoke-Test .rpm (Fedora 41)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build .rpm in Fedora 41 container
        run: |
          docker run --rm \
            -v "$PWD:/work/src:rw" \
            -w /work/src \
            fedora:41 \
            bash -eux -c '
              dnf install -y --setopt=install_weak_deps=False \
                rpm-build gcc-c++ make \
                qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel \
                libarchive-devel desktop-file-utils tar gzip findutils
              ./packaging/build-rpm.sh
              chmod -R a+rX /work/src/release
            '

      - name: Smoke-test .rpm in clean Fedora 41 container
        run: |
          docker run --rm \
            -v "$PWD/release:/work/pkg:ro" \
            -v "$PWD/packaging/smoke-test-package.sh:/work/smoke-test-package.sh:ro" \
            fedora:41 \
            bash -eux -c '
              dnf install -y --setopt=install_weak_deps=False \
                /work/pkg/twinforge-*.rpm python3 desktop-file-utils
              /work/smoke-test-package.sh /usr/bin/twinforge
            '

      - name: Upload Fedora RPM asset
        uses: actions/upload-artifact@v4
        with:
          name: release-rpm
          path: release/*.rpm
          if-no-files-found: error

  publish-release:
    name: Assemble Checksums & Publish GitHub Release
    needs: [build-deb-and-tarball, build-rpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist-release
          sha256sum *.deb *.rpm *.tar.gz > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: Publish Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist-release/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "TwinForge $TAG"
          fi
