name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (Qt 6 / C++20)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 & build dependencies
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            build-essential \
            qmake6 \
            qt6-base-dev \
            qt6-declarative-dev \
            libqt6svg6-dev \
            libqt6svg6 \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window \
            qml6-module-qtquick-templates \
            qml6-module-qtcore \
            libarchive-dev \
            poppler-utils \
            ffmpeg \
            zip \
            unzip \
            p7zip-full \
            git

      - name: Build TwinForge
        run: ./bin/build

      - name: Run Automated Test Suite (63 tests)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./bin/test
